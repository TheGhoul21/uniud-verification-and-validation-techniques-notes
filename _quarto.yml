project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "notebooks/*.qmd"
    - "!docs/"

website:
  title: "Verification and Validation Techniques — UniUD"
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Notebooks
        menu:
          - text: "NB 1 — Intro"
            href: notebooks/01-intro.qmd

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
