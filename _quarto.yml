project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "notebooks/*.qmd"
    - "mindmaps/*.qmd"
    - "proofs/*.qmd"
    - "proofs/chapter-*/*.qmd"
    - "!docs/"
  resources:
    - "CNAME"
    - "privacy-policy.html"
    - "robots.txt"
    - "mindmaps/mindmap.css"
    - "mindmaps/mindmap.js"
    - "proofs/proof-lab.css"
    - "proofs/proof-lab-content.js"
    - "proofs/proof-lab.js"

website:
  title: "Verification and Validation Techniques — UniUD"
  site-url: "https://vvt.aliteia.com"
  description: "Interactive companion for the Verification and Validation Techniques course at Università degli Studi di Udine — guided theorem proofs, mind maps, and browser-based automata visualizations."
  favicon: images/favicon.svg
  open-graph:
    site-name: "Verification and Validation Techniques — UniUD"
    locale: en_US
    image: images/social-preview.jpg
  twitter-card:
    image: images/social-preview.jpg
  google-analytics: "G-V5T4WKNT8G"
  cookie-consent:
    type: implied
    style: simple
    palette: dark
    policy-url: "/privacy-policy.html"
  page-footer:
    center: "[Privacy & Cookies](/privacy-policy.html)"
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Proof Labs
        href: proofs/index.qmd
      - text: Mind Maps
        href: mindmaps/index.qmd
      - text: Notebooks
        href: notebooks/index.qmd

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@500;600&display=swap" rel="stylesheet">
