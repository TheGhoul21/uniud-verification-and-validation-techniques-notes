project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "notebooks/*.qmd"
    - "!docs/"
  resources:
    - "CNAME"
    - "privacy-policy.html"

website:
  title: "Verification and Validation Techniques — UniUD"
  site-url: "https://vvt.aliteia.com"
  description: "Interactive companion for the Verification and Validation Techniques course at Università degli Studi di Udine — browser-based automata visualizations covering finite-state automata, NFA-to-DFA subset construction, epsilon-closure, product automata, and reachability fixpoint algorithms."
  favicon: images/favicon.svg
  open-graph:
    site-name: "Verification and Validation Techniques — UniUD"
    locale: en_US
  twitter-card: true
  google-analytics: "G-V5T4WKNT8G"
  cookie-consent:
    type: implied
    style: simple
    palette: dark
    policy-url: "/privacy-policy.html"
  page-footer:
    center: "[Privacy & Cookies](/privacy-policy.html)"
  navbar:
    left:
      - text: Home
        href: index.qmd
      - text: Notebooks
        menu:
          - text: "NB 1 — Intro"
            href: notebooks/01-intro.qmd
          - text: "NB 2 — NFA Reachable States"
            href: notebooks/02-nfa-reachable-states.qmd
          - text: "NB 3 — Subset Construction"
            href: notebooks/03-subset-construction.qmd
          - text: "NB 4 — ε-Closure & ε-Removal"
            href: notebooks/04-epsilon-closure-removal.qmd
          - text: "NB 5 — Product Automaton"
            href: notebooks/05-product-automaton.qmd
          - text: "NB 6 — Reachability Fixpoint"
            href: notebooks/06-reachability-fixpoint.qmd
          - text: "NB 7 — Kleene State Elimination"
            href: notebooks/07-kleene-state-elimination.qmd

format:
  html:
    theme: [cosmo, custom.scss]
    toc: true
    toc-depth: 3
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
